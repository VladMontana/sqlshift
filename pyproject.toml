[project]
name = "sqlshift"
version = "0.1.0"
description = "Cross-dialect SQL query router and transpiler for hybrid OLTP/OLAP systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "rich>=13.0.0",
    "sqlglot>=25.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
client = [
    "asyncpg>=0.29.0",
    "clickhouse-connect>=0.7.0",
]
server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "pydantic-settings>=2.0.0",
]
all = [
    "sqlshift[client,server]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlshift"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/sqlshift/core/html_report.py" = ["E501", "W291", "W293"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "clickhouse_connect.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ty>=0.0.81",
]

[project.scripts]
sqlshift = "sqlshift.cli.main:app"
